<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News</title>
    <!-- 引入 Bootstrap CSS，版本 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 为整个页面设置主题颜色 */
        body {
            background-color: #55ABED; /* 新的主题颜色 */
            color: #ffffff; /* 确保文字颜色为白色，以便在深色背景下清晰可见 */
            font-family: 'Inter', sans-serif; /* 使用 Inter 字体 */
        }
        
        /* 设置导航栏的样式，使其背景半透明，并带有一些圆角 */
        .navbar {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px); /* 添加毛玻璃效果 */
            -webkit-backdrop-filter: blur(10px);
            transition: background-color 0.3s ease-in-out, backdrop-filter 0.3s ease-in-out;
        }

        .navbar-brand, .nav-link {
            color: #ffffff !important;
            font-weight: 500;
        }

        .nav-link:hover {
            color: #cccccc !important;
            border-bottom: 2px solid #ffffff; /* 鼠标悬停时添加白色下划线 */
            padding-bottom: 3px;
        }
        
        /* 英雄部分，背景图片样式 */
        .hero-section {
            background-color: rgba(255, 255, 255, 0.1);
            background-image: url('images/flags-globe-hq.jpg'); /* 使用新的背景图片 */
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay; /* 将背景色与图片叠加 */
            border-radius: 1rem;
            padding: 4rem 2rem;
            margin-top: 80px;
            text-align: left; /* 文字左对齐 */
        }
        
        /* 确保文字在背景图片上清晰可见 */
        .hero-content {
            background-color: rgba(0, 0, 0, 0.6); /* 半透明黑色背景，让文字更突出 */
            padding: 2rem;
            border-radius: 1rem;
        }

        .section-title {
            font-weight: 700;
            margin-bottom: 2rem;
            color: #ffffff;
        }

        /* 统一卡片样式 */
        .card {
            background-color: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 1rem;
            color: #ffffff;
            margin-bottom: 2rem;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px); /* 悬停时上移效果 */
        }

        .footer {
            background-color: rgba(0, 0, 0, 0.5);
            padding: 2rem 0;
            text-align: center;
        }
        
        /* 语言切换按钮样式 */
        .lang-switcher a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 1rem;
            font-weight: bold;
        }

        .lang-switcher a:hover {
            text-decoration: underline;
        }

        /* 标志图片样式，将其高度调整为60px */
        .navbar-brand img {
            height: 60px; /* 新的高度 */
            margin-right: 15px; /* 调整右侧间距 */
        }

        /* 导航栏顶部的透明样式 */
        .navbar.scrolled-down {
            background-color: rgba(0, 0, 0, 0); /* 保持透明 */
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
        }

        /* 活动卡片图片样式 */
        .activity-card img {
            border-radius: 1rem 1rem 0 0;
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <!-- 协会标志 -->
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <!-- 标志图片 -->
                <img src="images/logo globee.webp" alt="Global Youth Civilizations Dialogue Alliance Logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html" id="nav-home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="news.html" id="nav-news">News</a>
                    </li>
                    </li class="nav-item">
                        <a class="nav-link" href="activities.html" id="nav-activities">Activities</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#about-us-section" id="nav-about">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html" id="nav-contact">Contact Us</a>
                    </li>
                </ul>
                <div class="lang-switcher">
                    <a href="#" id="lang-zh">中文</a>
                    <a href="#" id="lang-en">EN</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要内容区域 -->
    <main class="container">
        <!-- 英雄部分，背景图片和文字 -->
        <div class="row">
            <div class="col-lg-12 hero-section">
                <div class="hero-content">
                    <h1 class="display-4 fw-bold" id="hero-title">Newsroom</h1>
                    <p class="fs-5 mt-3" id="hero-text">Check here for the latest updates on the Global Youth Dialogue.</p>
                </div>
            </div>
        </div>
        
                <!-- 新闻卡片 -->
            <div class="row my-5" id="news-section">
                <div class="col-lg-12">
                <div class="card" style="width: max-content;">
                        <a href="news/global-dialogue-on-ai-governance.html" class="card activity-card flex-fill text-decoration-none">
                            <img src="news/news images/global-dialogue-on-ai-governance/image-4.webp" class="card-img-top" alt="Global Dialogue on AI Governance">
                            <div class="card-body">
                                <h5 class="card-title" id="card-title-1">Global Dialogue on AI Governance</h5>
                                <p class="card-text" id="card-text-1">September 2025</p>
                            </div>
                        </a>
                   
                
    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <span id="footer-text">&copy; 2025 Global Youth Dialogue among Cvilisations Alliance. All Rights Reserved.</span>
        </div>
    </footer>

    <!-- 引入 jQuery 和 Bootstrap 的 JavaScript 文件，以支持交互功能 -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 定义包含不同语言文本的翻译对象
        const translations = {
            'zh': {
                navBrand: '全球青年文明对话联盟',
                navHome: '主页',
                navNews: '新闻',
                navActivities: '活动',
                navAbout: '关于我们',
                navContact: '联系我们',
                heroTitle: '新闻中心',
                heroText: '在这里了解全球青年文明对话的最新动态',
                activitiesTitle: '活动',
                cardTitle1: '人工智能治理全球对话',
                cardText1: '2025年9月',
                footerText: '&copy; 2025 全球青年文明对话联盟. All Rights Reserved.'
            },
            'en': {
                navBrand: 'Global Youth Civilizations Dialogue Alliance',
                navHome: 'Home',
                navNews: 'News',
                navActivities: 'Activities',
                navAbout: 'About Us',
                navContact: 'Contact Us',
                heroTitle: 'Newsroom',
                heroText: 'Check here for the latest updates on the Global Youth Dialogue.',
                activitiesTitle: 'Activities',
                cardTitle1: 'Global Dialogue on AI Governance',
                cardText1: 'September 2025',
                footerText: '&copy; 2025 Global Youth Dialogue among Cvilisations Alliance. All Rights Reserved.'
            }
        };

            // 获取所有需要翻译的元素
        const elementsToTranslate = {
            navHome: document.getElementById('nav-home'),
            navNews: document.getElementById('nav-news'),
            navActivities: document.getElementById('nav-activities'),
            navAbout: document.getElementById('nav-about'),
            navContact: document.getElementById('nav-contact'),
            heroTitle: document.getElementById('hero-title'),
            heroText: document.getElementById('hero-text'),
            activitiesTitle: document.getElementById('activities-title'),
            cardTitle1: document.getElementById('card-title-1'),
            cardText1: document.getElementById('card-text-1'),
            footerText: document.getElementById('footer-text'),
        };

        // 切换语言的函数
        function updateLanguage(lang) {
            const currentTranslations = translations[lang];
            for (const key in elementsToTranslate) {
                if (elementsToTranslate[key] && currentTranslations[key]) {
                    elementsToTranslate[key].innerHTML = currentTranslations[key];
                }
            }
        }

        // 添加事件监听器
        document.getElementById('lang-zh').addEventListener('click', (e) => {
            e.preventDefault();
            updateLanguage('zh');
        });

        document.getElementById('lang-en').addEventListener('click', (e) => {
            e.preventDefault();
            updateLanguage('en');
        });

        // 默认加载英文
        updateLanguage('en');

        // JavaScript to handle the navbar background on scroll
        window.addEventListener('scroll', () => {
            const navbar = document.querySelector('.navbar');
            if (window.scrollY > 0) {
                navbar.style.backgroundColor = 'rgba(0, 0, 0, 0.5)';
                navbar.style.backdropFilter = 'blur(10px)';
                navbar.style.webkitBackdropFilter = 'blur(10px)';
            } else {
                navbar.style.backgroundColor = 'rgba(0, 0, 0, 0)';
                navbar.style.backdropFilter = 'blur(0px)';
                navbar.style.webkitBackdropFilter = 'blur(0px)';
            }
        });
    </script>
</body>
</html>
