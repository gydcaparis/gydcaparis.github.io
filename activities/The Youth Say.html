p3: "正是在这样的背景下，GYDCA｜全球青年文明对话联盟 发起了 The Youth Say 全球青话会 世界青年视频共创计划。",
p4: "这是一个面向全球的青年内容与对话项目。我们希望邀请来自不同国家、文化与语言背景的青年，通过影像、故事与真实的生活记录，讲述“我是谁”“我从哪里来”“我如何看待这个世界”。",

p10: "在创作之外，这也是一个持续展开的青年议题对话空间。",
p11: "项目将与 UNESCO 及其青年议程建立长期互动，围绕国际教育日、国际妇女节、非洲日、国际青年日、世界文化多样性日、UNESCO 世界青年峰会等节点展开共创。",

p12: "你将加入一个真实而活跃的全球青年社群。",
p13: "我们也将定期举办 Salon de Thé 青年文明对话沙龙，邀请学者、媒体人与青年行动者展开交流。",

benefitsTitle: "加入 GYDCA 全球青年 Correspondents，你将获得：",

"加入跨文化全球青年网络,拓展国际视野与跨文化理解能力",
"署名发布你的作品，积累作品与个人表达成果",

"有机会获得GYDCA项目参与以及实习机会，并出具官方证明与推荐信"

applyText: "加入 GYDCA 首期全球青年 Correspondents",

applyLabel: "立即报名（截止 2026 年 2 月 9 日）",
follow: "欢迎关注 INS：@gydca.youth 并加入 WhatsApp 全球青年社群"
},

en: {
title: "GYDCA | Global Youth Correspondents 2026 Recruitment",
subtitle: "The Youth Say | A Global Youth Video Co-Creation Project",
deadline: "📢 Expression of Interest is now open<br>First cohort application deadline: February 9, 2026",
contact: "For inquiries, please contact: contact@gydca.org",

p1: "Have you ever wondered what would happen if young people from around the world could truly see one another and truly listen to one another?",
p2: "In an age of rapid information flow, yet persistent misunderstanding and division, young people are becoming the generation most capable of crossing cultural, linguistic, and geographic boundaries. We live in different cities, speak different languages, yet face similar anxieties, hopes, and questions about the future.",

p5: "You do not need to be a professional journalist, nor do you need expensive equipment. A mobile phone, a genuine desire to express yourself, and the courage to share are enough.",

p6: "As a GYDCA Global Youth Correspondent, you will take part in an ongoing global video co-creation process.",
p7: "You may document a day in your life, introduce the everyday scenes and landmarks of your city, collaborate with a young person from another city or country, or share a story that has truly shaped who you are.",
p8: "You may also end your video by posing a question to a young person on the other side of the world, allowing dialogue to travel across cultures.",

p9: "All contributions will be jointly curated and edited, forming an ever-growing global portrait of youth — not youth being spoken for, but youth speaking for themselves.",
p10: "Beyond content creation, this project is also an evolving space for dialogue on youth issues.",
p11: "The project will establish long-term engagement with UNESCO youth agendas, responding to International Day of Education, International Women’s Day, Africa Day, International Youth Day, World Day for Cultural Diversity, the UNESCO World Youth Conference, and other key moments.",

p12: "You will become part of a vibrant and active global youth community.",
p13: "We will also host regular Salon de Thé Youth Dialogue Salons, bringing together scholars, media professionals, UNESCO project participants, and youth changemakers.",

benefitsTitle: "By joining GYDCA Global Youth Correspondents, you will gain:",
benefits: [
"Join a cross-cultural global youth network, expand international vision and cross-cultural understanding",
"Build a portfolio of works and personal expression",
"Travel to Paris with priority opportunities to participate in the UNESCO Youth Summit and related events",

],

applyLink: "https://docs.google.com/forms/d/e/1FAIpQLSfYx8v9KArBlgy4ny21Xt9LESt1YcjoFHffSTRzMk5WRqm6uQ/viewform",
applyLabel: "Apply now (Deadline: February 9, 2026)",
follow: "Follow us on Instagram @gydca.youth and join our WhatsApp Global Youth Community"
}

function setLang(lang) {
document.title = translations[lang].title;
document.getElementById("page-title").innerText = translations[lang].title;

for (const key in translations[lang]) {
  if (document.getElementById(key)) {
    document.getElementById(key).innerHTML = translations[lang][key];
  }
}

const list = document.getElementById("benefits");
list.innerHTML = "";
translations[lang].benefits.forEach(i => {
  const li = document.createElement("li");
  li.innerText = i;
  list.appendChild(li);
});

document.getElementById("applyLink").href = translations[lang].applyLink;
document.getElementById("applyLink").innerText = translations[lang].applyLabel;
}

setLang("en");
